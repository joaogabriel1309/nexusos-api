services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusos}
      POSTGRES_USER: ${POSTGRES_USER:-nexusos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexusos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusos} -d ${POSTGRES_DB:-nexusos}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nexusos-postgres-data:
