name: Deploy de producao

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Validar aplicacao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexusos
          POSTGRES_USER: nexusos
          POSTGRES_PASSWORD: nexusos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusos -d nexusos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Baixar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testar backend
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexusos-web/package-lock.json

      - name: Instalar frontend
        working-directory: nexusos-web
        run: npm ci

      - name: Validar tipos do frontend
        working-directory: nexusos-web
        run: npm run typecheck

      - name: Gerar build do frontend
        working-directory: nexusos-web
        run: npm run build

  deploy:
    name: Deploy na VPS
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}

    steps:
      - name: Validar secrets obrigatorios
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY VPS_SSH_HOST_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Secrets obrigatorios ausentes: ${missing[*]}"
            exit 1
          fi

          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "::error::VPS_PORT deve ser uma porta TCP valida."
            exit 1
          fi

      - name: Preparar acesso SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VPS_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Atualizar aplicacao e containers
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          trap 'echo "Deploy falhou na linha $LINENO." >&2' ERR

          cd /opt/nexusos-api

          if [[ ! -f docker-compose.prod.yml ]]; then
            echo "docker-compose.prod.yml nao foi encontrado em /opt/nexusos-api." >&2
            exit 1
          fi

          echo "Atualizando a branch master..."
          git fetch origin master
          git reset --hard origin/master

          echo "Validando e subindo os containers..."
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml up -d --build

          echo "Removendo somente imagens sem uso..."
          docker image prune -f

          echo "Status dos containers:"
          docker ps

          echo "Ultimas linhas dos logs:"
          docker compose -f docker-compose.prod.yml logs --tail=50 --no-color
          REMOTE_SCRIPT

      - name: Remover chave SSH temporaria
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
