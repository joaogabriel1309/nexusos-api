spring:
  application:
    name: nexusos-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_JDBC_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nexusos}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${DATABASE_USERNAME:nexusos}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DATABASE_PASSWORD:nexusos}}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

nexusos:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://nexusos-api.vercel.app}
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:60}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  storage:
    uploads-path: ${UPLOADS_PATH:uploads}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    org.springframework.security: info
