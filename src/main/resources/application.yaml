spring:
  application:
    name: nexusos-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_JDBC_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nexusos}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${DATABASE_USERNAME:nexusos}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DATABASE_PASSWORD:nexusos}}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}

nexusos:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://nexusos-api.vercel.app}
  security:
    cookies:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    jwt:
      secret: ${JWT_SECRET:}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  storage:
    uploads-path: ${UPLOADS_PATH:uploads}
  portal-cliente:
    token-expiration-days: ${PORTAL_CLIENTE_TOKEN_EXPIRATION_DAYS:90}
  sla:
    baixa-dias: ${SLA_BAIXA_DIAS:10}
    media-dias: ${SLA_MEDIA_DIAS:5}
    alta-dias: ${SLA_ALTA_DIAS:2}
    critica-dias: ${SLA_CRITICA_DIAS:1}
  mercado-pago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    encryption-key: ${PAGAMENTO_ENCRYPTION_KEY:${JWT_SECRET:}}
    api-url: ${MERCADO_PAGO_API_URL:https://api.mercadopago.com}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    api-base-url: ${API_PUBLIC_URL:http://localhost:8080}
  email:
    encryption-key: ${EMAIL_ENCRYPTION_KEY:${JWT_SECRET:}}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  github:
    encryption-key: ${GITHUB_ENCRYPTION_KEY:${JWT_SECRET:}}
    api-url: ${GITHUB_API_URL:https://api.github.com}
  ia:
    encryption-key: ${IA_ENCRYPTION_KEY:${JWT_SECRET:}}
  whatsapp:
    encryption-key: ${WHATSAPP_ENCRYPTION_KEY:${JWT_SECRET:}}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
    callmebot-api-url: ${WHATSAPP_CALLMEBOT_API_URL:https://api.callmebot.com}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:55}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

nexusos:
  security:
    jwt:
      secret: ${JWT_SECRET:nexusos-local-dev-secret-32-bytes-minimum-use-only-dev}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    org.springframework.security: info

nexusos:
  security:
    cookies:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    jwt:
      secret: ${JWT_SECRET:}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
