spring:
  application:
    name: nexusos-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_JDBC_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nexusos}}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:${DATABASE_USERNAME:nexusos}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DATABASE_PASSWORD:nexusos}}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

nexusos:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://nexusos-api.vercel.app}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:60}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  storage:
    uploads-path: ${UPLOADS_PATH:uploads}
  mercado-pago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    api-url: ${MERCADO_PAGO_API_URL:https://api.mercadopago.com}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    api-base-url: ${API_PUBLIC_URL:http://localhost:8080}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:${MAIL_USERNAME:}}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    provider: ${WHATSAPP_PROVIDER:callmebot}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
    callmebot-api-url: ${WHATSAPP_CALLMEBOT_API_URL:https://api.callmebot.com}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:55}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

nexusos:
  security:
    jwt:
      secret: ${JWT_SECRET:nexusos-local-dev-secret-32-bytes-minimum-use-only-dev}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    org.springframework.security: info

nexusos:
  security:
    jwt:
      secret: ${JWT_SECRET:}
