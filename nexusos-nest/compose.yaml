services:
  api:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexusos:nexusos@postgres:5432/nexusos
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      UPLOADS_PATH: /app/uploads
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexusos
      POSTGRES_USER: nexusos
      POSTGRES_PASSWORD: nexusos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexusos -d nexusos']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  uploads:
